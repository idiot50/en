<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet"/>
  <meta name="theme-color" content="#58CC02"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="TOEIC Quest"/>
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <title>TOEIC Quest — Sổ lỗi sai</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=10"/>
  <link rel="alternate icon" href="/favicon.ico"/>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=10"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=11"/>
  <style>
    /* player styles (reused by quiz-core when reviewing) */
    .sub-q { padding: 16px 0; border-top: 1px dashed var(--border); }
    .sub-q:first-of-type { border-top: none; padding-top: 0; }
    .sub-q .q-num { font-size: 12px; font-weight: 800; color: var(--text-mute); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .sub-q .q-text { font-size: 17px; font-weight: 700; margin-bottom: 10px; line-height: 1.4; }
    .sub-q.blind .q-text { display:none; }
    .sub-q.blind .options { display:flex; flex-direction:row; justify-content:center; flex-wrap:wrap; gap:20px; padding:24px 0; margin-bottom:0; }
    .sub-q.blind .option { width:80px; height:80px; padding:0; border-radius:50%; justify-content:center; gap:0; }
    .sub-q.blind .option > span:not(.letter) { display:none; }
    .sub-q.blind .option .letter { width:100%; height:100%; background:transparent; border:none; font-size:32px; font-weight:900; }
    .group-toolbar { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg-alt) 80%, transparent); padding: 16px 0; display: flex; gap: 10px; align-items: center; z-index: 5; flex-wrap: wrap; }
    .pick-count { font-weight: 800; color: var(--text-soft); font-size: 13px; }
    .btn[disabled] { opacity: .5; cursor: not-allowed; box-shadow: 0 4px 0 var(--border); background: var(--text-mute); }
    .reveal-block { margin-top: 14px; padding: 14px; border-radius: 10px; background: var(--bg-alt); border-left: 4px solid var(--blue); }
    .reveal-block .heading { font-weight: 800; font-size: 13px; color: var(--text-mute); text-transform: uppercase; margin-bottom: 6px; letter-spacing: .5px; }
    .reveal-block .body { font-size: 14px; line-height: 1.6; white-space: pre-line; max-height: 280px; overflow-y: auto; }
    .player-header { position: sticky; top: 0; z-index: 10; background: var(--bg-alt); padding: 10px 0; margin-bottom: 12px; border-bottom: 2px solid var(--border); }
    .test-timer { font-weight: 900; font-size: 15px; padding: 6px 12px; border-radius: 12px; background: white; border: 2px solid var(--border); white-space: nowrap; }
    .test-timer.warning { background: #ffe0e0; color: #e02020; }
    .q-result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; margin-top: 8px; }
    .q-result { padding: 10px 0; border-radius: 10px; font-weight: 800; font-size: 15px; border: 2px solid var(--border); cursor: pointer; color: white; }
    .q-result.correct { background: var(--green); border-color: var(--green-dark); }
    .q-result.wrong { background: var(--red); border-color: #c0392b; }
    .q-result.blank { background: var(--text-mute); border-color: var(--border); }
    .q-card .option[disabled] { cursor: default; opacity: 1; }
    /* list */
    .er-item { display:flex; gap:12px; align-items:flex-start; background:white; border:2px solid var(--border); border-radius:14px; padding:13px 16px; margin-bottom:10px; }
    .er-main { flex:1; min-width:0; }
    .er-q { font-weight:700; font-size:14.5px; line-height:1.5; }
    .er-meta { font-size:11.5px; color:var(--text-mute); margin-top:4px; font-weight:700; }
    .er-box { flex:none; font-size:11px; font-weight:800; border-radius:8px; padding:4px 9px; white-space:nowrap; }
    .er-box.b1 { background:#fff0f0; color:#c0392b; }
    .er-box.b2 { background:#fff7e0; color:#b8860b; }
    .er-box.b3 { background:#eaf6ff; color:var(--blue-dark); }
    .er-box.grad { background:#f0ffe6; color:var(--green-dark); }
    .er-del { border:2px solid var(--border); background:var(--bg-alt); border-radius:9px; padding:5px 9px; cursor:pointer; font-size:12.5px; }
    .er-del:hover { border-color:var(--red); color:var(--red); }
    .er-filter { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
    .er-chip { border:2px solid var(--border); background:white; border-radius:10px; padding:7px 13px; font-weight:800; cursor:pointer; font-size:13px; }
    .er-chip.active { border-color:var(--green); background:#f3fff0; color:var(--green-dark); }
    /* clickable list rows */
    .er-item.link { cursor:pointer; transition:all .12s; }
    .er-item.link:hover { border-color:var(--blue); transform:translateY(-1px); box-shadow:0 3px 0 var(--blue-dark); }
    .er-open { flex:none; align-self:center; font-weight:900; color:var(--blue-dark); font-size:18px; }
    /* detail view */
    .dt-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .dt-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .dt-tag { font-size:12px; font-weight:800; border-radius:9px; padding:5px 11px; background:var(--bg-alt); color:var(--text-soft); border:2px solid var(--border); }
    .dt-tag.bad { background:#fff0f0; color:#c0392b; border-color:#f3c0c0; }
    .dt-tag.ok { background:#f0ffe6; color:var(--green-dark); border-color:var(--green); }
    .dt-opt { display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border-radius:12px; border:2px solid var(--border); background:white; margin-bottom:8px; font-size:15px; line-height:1.45; }
    .dt-opt .L { font-weight:900; width:26px; height:26px; border-radius:8px; background:var(--bg-alt); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; flex:none; font-size:13px; }
    .dt-opt.correct { background:#f0ffe6; border-color:var(--green); color:var(--green-dark); font-weight:700; }
    .dt-opt.correct .L { background:var(--green); border-color:var(--green); color:white; }
    .dt-opt.chosen { background:#fff0f0; border-color:var(--red); color:var(--red-dark); }
    .dt-opt.chosen .L { background:var(--red); border-color:var(--red); color:white; }
    .dt-badge { margin-left:auto; font-size:11.5px; font-weight:800; white-space:nowrap; align-self:center; }
    .dt-img { max-width:100%; max-height:340px; border-radius:12px; border:2px solid var(--border); margin-bottom:14px; }
    .dt-nav { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:20px; }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script src="/js/state.js?v=11"></script>
  <script src="/js/history.js?v=1"></script>
  <script src="/js/catalog.js?v=10"></script>
  <script src="/js/layout.js?v=13"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-init.js?v=1"></script>
  <script src="/js/auth.js?v=1"></script>
  <script src="/js/csv.js?v=10"></script>
  <script src="/js/quiz-core.js?v=15"></script>
  <script src="/js/vocab-notes.js?v=5"></script>
  <script>
  (function () {
    const root = document.getElementById('app');
    const { sidebar, topbar } = renderShell({ active: 'mistakes', state: State.load() });
    const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const EB = QuizCore.ErrorBox;
    VocabNotes.enableCapture();
    let partFilter = 0;   // 0 = all

    function boxChip(e) {
      if (e.grad) return '<span class="er-box grad">✓ Đã thuộc</span>';
      const cls = e.box <= 1 ? 'b1' : e.box === 2 ? 'b2' : 'b3';
      return `<span class="er-box ${cls}">Hộp ${e.box} · ôn ${esc(e.due)}</span>`;
    }

    function render() {
      const c = EB.counts();
      const all = EB.entries().sort((a, b) => (a.grad === b.grad ? (a.due < b.due ? -1 : 1) : (a.grad ? 1 : -1)));
      const vis = partFilter ? all.filter(e => e.d.part === partFilter) : all;
      const partsPresent = Array.from(new Set(all.map(e => e.d.part))).sort();
      const listHtml = !all.length
        ? '<p style="color:var(--text-mute);">Chưa có câu sai nào được ghi. Cứ luyện ở <a href="/drill" style="color:var(--blue-dark);text-decoration:underline;">Ôn theo Part</a>, <a href="/quick" style="color:var(--blue-dark);text-decoration:underline;">Kiểm tra nhanh</a> hoặc <a href="/tests" style="color:var(--blue-dark);text-decoration:underline;">Bài thi</a> — câu trả lời sai sẽ tự động vào đây.</p>'
        : vis.slice(0, 100).map(e => `
          <div class="er-item link" data-open="${esc(e.id)}" title="Bấm để xem lại câu này">
            <div class="er-main">
              <div class="er-q">${esc((e.d.q || '(Câu hình/nghe Part ' + e.d.part + ')').slice(0, 140))}</div>
              <div class="er-meta">${esc((e.d.year === 'Economy' ? 'Cơ bản' : e.d.year) + ' • Đề ' + e.d.n + ' • Part ' + e.d.part + ' • Câu ' + e.d.qNum)} · sai ${e.wrong} lần · đáp án: ${esc(e.d.a)}</div>
            </div>
            ${boxChip(e)}
            <span class="er-open">›</span>
            <button class="er-del" data-id="${esc(e.id)}" title="Bỏ theo dõi">🗑</button>
          </div>`).join('');

      root.innerHTML = sidebar + `<main class="main">${topbar}
        <h2 style="font-size:26px;font-weight:900;">🩹 Sổ lỗi sai</h2>
        <p style="color:var(--text-mute);margin:6px 0 12px;line-height:1.6;">
          Câu trả lời sai được <b>tự động gom về đây</b> và hẹn ôn lại theo chu kỳ <b>1 → 3 → 7 → 21 ngày</b>.
          Trả lời đúng liên tiếp tới Hộp 4 là "tốt nghiệp". Đây chính là "sổ lỗi" trong lộ trình 650 của bạn.
        </p>
        <div class="stats-grid">
          <div class="stat-card"><div class="big" style="color:var(--red);">🩹 ${c.active}</div><div class="label">Đang theo dõi</div></div>
          <div class="stat-card"><div class="big" style="color:#E07b1e;">🔔 ${c.due}</div><div class="label">Đến hạn hôm nay</div></div>
          <div class="stat-card"><div class="big" style="color:var(--green);">🏅 ${c.grad}</div><div class="label">Đã thuộc</div></div>
        </div>
        <div style="margin:14px 0;">
          <button class="btn gold" id="er-review" ${c.due ? '' : 'disabled'}>🔔 Ôn ${c.due} câu đến hạn</button>
          ${!c.due && c.active ? '<span style="font-size:13px;color:var(--text-mute);margin-left:10px;">Chưa có câu đến hạn — quay lại vào ngày ôn nhé.</span>' : ''}
        </div>
        <h3 class="section-title">Danh sách câu sai <span style="font-weight:700;font-size:13px;color:var(--text-mute);">— bấm vào một câu để xem lại đầy đủ</span></h3>
        <div class="er-filter">
          <button class="er-chip ${partFilter === 0 ? 'active' : ''}" data-p="0">Tất cả (${all.length})</button>
          ${partsPresent.map(p => `<button class="er-chip ${partFilter === p ? 'active' : ''}" data-p="${p}">Part ${p} (${all.filter(e => e.d.part === p).length})</button>`).join('')}
        </div>
        <div>${listHtml}</div>
      </main>`;

      root.querySelectorAll('.er-chip').forEach(b => b.addEventListener('click', () => { partFilter = parseInt(b.dataset.p, 10); render(); }));
      root.querySelectorAll('.er-del').forEach(b => b.addEventListener('click', ev => {
        ev.stopPropagation();                       // don't open the detail view
        if (!confirm('Bỏ theo dõi câu này?')) return;
        EB.removeId(b.dataset.id);
        render();
      }));
      // Row -> detail view (deep-linkable via ?q=<id>)
      root.querySelectorAll('.er-item.link').forEach(el => el.addEventListener('click', () => {
        const id = el.dataset.open;
        history.pushState({ q: id }, '', '/mistakes?q=' + encodeURIComponent(id));
        renderDetail(id);
      }));
      const rv = document.getElementById('er-review');
      if (rv && c.due) rv.addEventListener('click', startReview);
    }

    // ---------- detail: review one wrong answer in full ----------
    function visibleList() {
      const all = EB.entries().sort((a, b) => (a.grad === b.grad ? (a.due < b.due ? -1 : 1) : (a.grad ? 1 : -1)));
      return partFilter ? all.filter(e => e.d.part === partFilter) : all;
    }
    function goList() {
      history.pushState({}, '', '/mistakes');
      render();
      window.scrollTo({ top: 0 });
    }
    function renderDetail(id) {
      const list = visibleList();
      const i = list.findIndex(x => x.id === id);
      const e = i >= 0 ? list[i] : EB.entries().find(x => x.id === id);
      if (!e) { goList(); return; }
      const d = e.d;
      const prev = i > 0 ? list[i - 1] : null;
      const next = i >= 0 && i < list.length - 1 ? list[i + 1] : null;
      const srcLabel = (d.year === 'Economy' ? 'Cơ bản' : d.year) + ' • Đề ' + d.n + ' • Part ' + d.part + ' • Câu ' + d.qNum;
      const audioUrl = d.au ? QuizCore.assetUrl(d.year, d.n, 'audio', d.au) : null;
      const imgUrl = d.im ? QuizCore.assetUrl(d.year, d.n, 'image', d.im) : null;
      const opts = (d.o || []).map(o => {
        const isOk = o.L === d.a, isPick = d.c && o.L === d.c && !isOk;
        return `<div class="dt-opt ${isOk ? 'correct' : ''}${isPick ? ' chosen' : ''}">
            <span class="L">${esc(o.L)}</span><span>${esc(o.text || '')}</span>
            ${isOk ? '<span class="dt-badge" style="color:var(--green-dark);">✓ Đáp án đúng</span>' : ''}
            ${isPick ? '<span class="dt-badge" style="color:var(--red);">✗ Bạn đã chọn</span>' : ''}
          </div>`;
      }).join('');
      root.innerHTML = sidebar + `<main class="main">
        <div class="dt-head">
          <button class="btn ghost small" id="dt-back">← Danh sách</button>
          <h2 style="font-size:20px;font-weight:900;flex:1;min-width:200px;">🩹 Xem lại câu sai</h2>
          <span style="font-size:12.5px;color:var(--text-mute);font-weight:800;">${i >= 0 ? (i + 1) + '/' + list.length : ''}</span>
        </div>
        <div class="dt-meta">
          <span class="dt-tag">${esc(srcLabel)}</span>
          <span class="dt-tag bad">Sai ${e.wrong} lần</span>
          ${e.grad ? '<span class="dt-tag ok">🏅 Đã thuộc</span>' : `<span class="dt-tag">Hộp ${e.box} · ôn lại ${esc(e.due)}</span>`}
        </div>
        <div class="q-card">
          ${audioUrl ? `<audio controls preload="none" src="${esc(audioUrl)}"></audio>` : ''}
          ${imgUrl ? `<img class="dt-img" src="${esc(imgUrl)}" alt="Hình câu hỏi"/>` : ''}
          ${d.s ? `<div class="reveal-block"><div class="heading">📜 ${d.part <= 4 ? 'Script bài nghe' : 'Đoạn văn'}</div><div class="body">${QuizCore.nl2br(d.s)}</div></div>` : ''}
          <div class="q-text" style="font-size:18px;font-weight:800;margin:16px 0 12px;line-height:1.5;">
            ${d.q ? QuizCore.highlightBlanks(d.q) : '<span style="color:var(--text-mute);">(Câu nghe/hình — nghe audio ở trên)</span>'}
          </div>
          ${opts || '<p style="color:var(--text-mute);">Không lưu được các lựa chọn của câu này.</p>'}
          ${d.e ? `<div class="reveal-block" style="border-left-color:var(--gold,#ffc800);margin-top:16px;"><div class="heading">💡 Giải thích</div><div class="body">${QuizCore.nl2br(d.e)}</div></div>` : ''}
          ${d.tr ? `<div class="reveal-block" style="border-left-color:var(--green);"><div class="heading">🇻🇳 Bản dịch</div><div class="body">${QuizCore.nl2br(d.tr)}</div></div>` : ''}
        </div>
        <div class="dt-nav">
          <button class="btn ghost" id="dt-prev" ${prev ? '' : 'disabled'}>← Câu trước</button>
          <button class="btn ghost" id="dt-next" ${next ? '' : 'disabled'}>Câu sau →</button>
          <span style="flex:1"></span>
          <button class="btn gold" id="dt-redo">🔁 Làm lại câu này</button>
          <button class="btn ghost small" id="dt-drop" style="color:var(--red);">🗑 Bỏ theo dõi</button>
        </div>
      </main>`;
      document.getElementById('dt-back').onclick = goList;
      const pv = document.getElementById('dt-prev');
      if (pv && prev) pv.onclick = () => { history.replaceState({ q: prev.id }, '', '/mistakes?q=' + encodeURIComponent(prev.id)); renderDetail(prev.id); window.scrollTo({ top: 0 }); };
      const nx = document.getElementById('dt-next');
      if (nx && next) nx.onclick = () => { history.replaceState({ q: next.id }, '', '/mistakes?q=' + encodeURIComponent(next.id)); renderDetail(next.id); window.scrollTo({ top: 0 }); };
      document.getElementById('dt-drop').onclick = () => {
        if (!confirm('Bỏ theo dõi câu này?')) return;
        EB.removeId(id); goList();
      };
      document.getElementById('dt-redo').onclick = () => {
        try { const s = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA='); s.volume = 0; const p = s.play(); if (p && p.catch) p.catch(()=>{}); } catch (er) {}
        const cards = EB.toCards([e]);
        if (!cards.length) { alert('Không dựng lại được câu này.'); return; }
        QuizCore.startQuiz({
          root, sidebar, cards, minutes: 5, instantFeedback: true, feature: 'mistakes',
          noteButton: (ctx) => VocabNotes.openModal({ src: (ctx && ctx.src) || '' }),
          icon: '🩹', title: 'Kết quả ôn lại',
          backUrl: '/mistakes?q=' + encodeURIComponent(id), backLabel: 'Về câu này',
          onResults: (rs) => rs.forEach(r => { if (EB.idOf(r) === id) EB.grade(id, r.chosen != null && r.isCorrect); })
        });
      };
      window.scrollTo({ top: 0 });
    }

    function startReview() {
      // unlock audio in this gesture (listening-part errors replay their audio)
      try { const s = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA='); s.volume = 0; const p = s.play(); if (p && p.catch) p.catch(()=>{}); } catch (e) {}
      const due = EB.dueList().slice(0, 20);
      if (!due.length) return;
      const idsByKey = {};
      due.forEach(e => { idsByKey[e.id] = true; });
      const cards = EB.toCards(due);
      QuizCore.startQuiz({
        root, sidebar, cards, feature: 'mistakes',
        minutes: Math.max(10, Math.ceil(due.length * 1.5)),
        instantFeedback: true,
        noteButton: (ctx) => VocabNotes.openModal({ src: (ctx && ctx.src) || '' }),
        icon: '🩹', title: 'Kết quả ôn câu sai',
        backUrl: '/mistakes', backLabel: 'Về sổ lỗi sai',
        onResults: (rs) => {
          rs.forEach(r => {
            const id = EB.idOf(r);
            if (idsByKey[id]) EB.grade(id, r.chosen != null && r.isCorrect);
          });
        },
        onFinish: (s) => {
          if (window.Auth && Auth.addHistory) Auth.addHistory({ type: 'mistakes', total: s.total, correct: s.correct, wrong: s.wrong, blank: s.blank });
        }
      });
    }

    // Deep-link: /mistakes?q=<id> opens that question directly; Back returns to the list.
    function route() {
      const q = new URLSearchParams(location.search).get('q');
      if (q) renderDetail(q); else render();
    }
    window.addEventListener('popstate', route);
    route();
  })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('/service-worker.js').catch(()=>{}); });
    }
  </script>
</body>
</html>
