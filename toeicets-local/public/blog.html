            <p class="meta">Cập nhật: 05/2026 · Đọc trong ~8 phút</p>

            <h2 id="what">🎯 TOEIC là gì?</h2>
            <p><b>TOEIC</b> (Test of English for International Communication) là bài thi đánh giá khả năng tiếng Anh trong môi trường công sở quốc tế, do tổ chức <a class="ext" href="https://www.ets.org/toeic" target="_blank" rel="noopener">ETS (Educational Testing Service)</a> phát triển. Đây là chứng chỉ tiếng Anh được công nhận tại hơn 160 quốc gia.</p>
            <p>Tại Việt Nam, TOEIC được sử dụng phổ biến cho:</p>
            <ul>
              <li><b>Tốt nghiệp đại học</b>: nhiều trường yêu cầu TOEIC 450–650 để xét chuẩn đầu ra</li>
              <li><b>Tuyển dụng</b>: ngân hàng, doanh nghiệp FDI, công ty công nghệ thường yêu cầu TOEIC 600+</li>
              <li><b>Xét lương / thăng chức</b> trong nhiều cơ quan nhà nước và doanh nghiệp</li>
              <li><b>Chứng minh năng lực</b> khi xin du học, làm việc nước ngoài</li>
            </ul>
            <p>Đơn vị đại diện chính thức của ETS tại Việt Nam là <a class="ext" href="https://iigvietnam.com/" target="_blank" rel="noopener">IIG Việt Nam</a>. Lệ phí thi TOEIC 4 kỹ năng hiện khoảng 1.6–2.0 triệu VND.</p>

            <h2 id="format">📝 Cấu trúc đề thi TOEIC</h2>
            <p>Đề TOEIC <b>Listening &amp; Reading</b> (phổ biến nhất) gồm <b>200 câu trắc nghiệm</b>, làm trong <b>2 tiếng</b>:</p>
            <h3>Phần Listening — 45 phút, 100 câu</h3>
            <ul>
              <li><b>Part 1</b> — Mô tả hình ảnh (6 câu)</li>
              <li><b>Part 2</b> — Hỏi đáp (25 câu)</li>
              <li><b>Part 3</b> — Đoạn hội thoại (39 câu)</li>
              <li><b>Part 4</b> — Bài nói chuyện (30 câu)</li>
            </ul>
            <h3>Phần Reading — 75 phút, 100 câu</h3>
            <ul>
              <li><b>Part 5</b> — Hoàn thành câu (30 câu)</li>
              <li><b>Part 6</b> — Hoàn thành đoạn văn (16 câu)</li>
              <li><b>Part 7</b> — Đọc hiểu (54 câu)</li>
            </ul>
            <div class="callout">
              💡 <b>Mẹo:</b> Phần Reading <i>không phát lại</i> — bạn tự quản lý thời gian. Phần Listening thì audio chỉ phát 1 lần duy nhất, không tua được.
            </div>

            <h2 id="score">📊 Thang điểm TOEIC và quy đổi</h2>
            <p>Mỗi kỹ năng (LC, RC) chấm từ 5–495 điểm, tổng tối đa 990. Dưới đây là bảng quy đổi sang khung CEFR (Châu Âu):</p>
            <table class="score-table">

                <tr><th>Điểm TOEIC</th><th>CEFR</th><th>Mô tả</th></tr>
              </thead>
              <tbody>
                <tr><td>10 – 249</td><td>A1</td><td>Sơ cấp, giao tiếp rất hạn chế</td></tr>
                <tr><td>250 – 549</td><td>A2</td><td>Trung cấp thấp, giao tiếp cơ bản</td></tr>
                <tr><td>550 – 784</td><td>B1</td><td>Trung cấp, công sở cơ bản — phổ biến đầu ra ĐH</td></tr>
                <tr><td>785 – 944</td><td>B2</td><td>Trung cao, làm việc tốt trong môi trường tiếng Anh</td></tr>
                <tr><td>945 – 990</td><td>C1</td><td>Cao cấp, gần như người bản xứ</td></tr>
              </tbody>
            </table>

            <h2 id="books">📚 Sách ôn TOEIC kinh điển</h2>

              <li><b>Hackers TOEIC Reading / Listening Start</b> — Hàn Quốc, giáo trình rất logic, phù hợp người mới.</li>
              <li><b>Big Step TOEIC 1, 2, 3</b> — chia level rõ ràng (300+ / 500+ / 700+).</li>
              <li><b>Tactics for TOEIC</b> (Oxford) — chiến thuật làm bài theo từng Part.</li>
              <li><b>Longman New Real TOEIC</b> — đề thi thật được tổng hợp lại.</li>
              <li><b>600 Essential Words for TOEIC</b> — Barron's, 600 từ cốt lõi nhất.</li>
            </ol>

            <h2 id="community">👥 Cộng đồng học TOEIC</h2>

              <li><b>Facebook</b> — Search "Học TOEIC", "Group TOEIC", "TOEIC Master" — có hàng chục group lớn, đăng câu hỏi sẽ có người trả lời nhanh</li>
              <li><b>Discord</b> — Server "English Learning" (link đổi liên tục, search trên disboard.org)</li>
            </ul>

            <h2 id="tips">📅 Lộ trình ôn TOEIC 3 tháng (mục tiêu 600+)</h2>
            <h3>Tháng 1 — Xây nền tảng</h3>
            <ul>
              <li>Học <b>1500 từ vựng TOEIC cốt lõi</b> (Quizlet/Anki): 15 từ/ngày</li>
              <li>Ôn lại ngữ pháp cơ bản: thì, câu điều kiện, bị động, mệnh đề quan hệ</li>
              <li>Mỗi ngày 30 phút Listening (VOA, BBC 6-minute English)</li>
              <li>Đọc 1 bài đọc TOEIC mỗi tối (không cần đo thời gian)</li>
            </ul>
            <h3>Tháng 2 — Làm quen format</h3>
            <ul>
              <li>Làm từng Part riêng lẻ: 1 Part/ngày, có chấm sai/đúng và rút kinh nghiệm</li>
              <li>Học chiến thuật làm bài (Tactics for TOEIC hoặc clip KIRA English)</li>
              <li>Listening shadow technique: chọn 1 audio 5–10 phút, nghe + lặp lại 10 lần</li>
              <li>Cuối tuần: 1 mini test (50 câu) để check tiến độ</li>
            </ul>
            <h3>Tháng 3 — Luyện đề + tốc độ</h3>
            <ul>
              <li><b>2 đề full/tuần</b> trong điều kiện giống thi thật (2 tiếng, không tra)</li>
              <li>Sau mỗi đề: phân tích sai ở Part nào → tập trung Part đó</li>
              <li>Học các "trick" thường gặp (paraphrase trong Listening, scanning trong Part 7)</li>
              <li>Tuần cuối: nghỉ ngơi 1-2 ngày, chỉ ôn nhẹ + ngủ đủ</li>
            </ul>
            <div class="callout">
              ⚡ <b>Nguyên tắc:</b> Đều đặn 60 phút/ngày &gt; cày 5 tiếng cuối tuần. Não cần thời gian "ngấm" giữa các buổi học.
            </div>
