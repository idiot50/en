<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet"/>
  <meta name="theme-color" content="#58CC02"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="TOEIC Quest"/>
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <title>TOEIC Quest — Kiểm tra nhanh</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=10"/>
  <link rel="alternate icon" href="/favicon.ico"/>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=10"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=11"/>
  <style>
    .sub-q { padding: 16px 0; border-top: 1px dashed var(--border); }
    .sub-q:first-of-type { border-top: none; padding-top: 0; }
    .sub-q .q-num { font-size: 12px; font-weight: 800; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .sub-q .q-text { font-size: 17px; font-weight: 700; margin-bottom: 10px; line-height: 1.4; }
    /* Blind mode: Part 1, 2 — hide question + option text while listening; show only A/B/C/D */
    .sub-q.blind .q-text { display: none; }
    .sub-q.blind .options { display: flex; flex-direction: row; justify-content: center; flex-wrap: wrap; gap: 20px; padding: 24px 0; margin-bottom: 0; }
    .sub-q.blind .option { width: 80px; height: 80px; padding: 0; border-radius: 50%; justify-content: center; gap: 0; }
    .sub-q.blind .option > span:not(.letter) { display: none; }
    .sub-q.blind .option .letter { width: 100%; height: 100%; background: transparent; border: none; font-size: 32px; font-weight: 900; }
    .sub-q.blind .option.selected { background: var(--blue); border-color: var(--blue-dark); }
    .sub-q.blind .option.selected .letter { color: white; }
    .group-toolbar { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg-alt) 80%, transparent); padding: 16px 0; display: flex; gap: 12px; align-items: center; z-index: 5; }
    .pick-count { font-weight: 800; color: var(--text-soft); font-size: 13px; }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; box-shadow: 0 4px 0 var(--border); background: var(--text-mute); }
    .reveal-block { margin-top: 14px; padding: 14px; border-radius: 10px; background: var(--bg-alt); border-left: 4px solid var(--blue); }
    .reveal-block .heading { font-weight: 800; font-size: 13px; color: var(--text-mute); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
    .reveal-block .body { font-size: 14px; line-height: 1.6; white-space: pre-line; max-height: 280px; overflow-y: auto; }
    /* timer + sticky header so the clock stays visible across all questions */
    .player-header { position: sticky; top: 0; z-index: 10; background: var(--bg-alt); padding: 10px 0; margin-bottom: 12px; border-bottom: 2px solid var(--border); }
    .test-timer { font-weight: 900; font-size: 15px; padding: 6px 12px; border-radius: 12px; background: white; border: 2px solid var(--border); color: var(--text); white-space: nowrap; }
    .test-timer.warning { background: #ffe0e0; color: #e02020; animation: timer-pulse 1s ease-in-out infinite; }
    @keyframes timer-pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
    /* result grid */
    .q-result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; margin-top: 8px; }
    .q-result { padding: 10px 0; border-radius: 10px; font-weight: 800; font-size: 15px; border: 2px solid var(--border); cursor: pointer; color: white; }
    .q-result.correct { background: var(--green); border-color: var(--green-dark); }
    .q-result.wrong { background: var(--red); border-color: #c0392b; }
    .q-result.blank { background: var(--text-mute); border-color: var(--border); }
    .q-result:hover { filter: brightness(1.08); }
    .q-card .option[disabled] { cursor: default; opacity: 1; }
    /* mode chooser */
    .mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 8px; }
    .mode-card { border: 3px solid var(--border); border-radius: 16px; padding: 18px; cursor: pointer; text-align: center; background: white; transition: all .12s; }
    .mode-card:hover { border-color: var(--blue); }
    .mode-card.active { border-color: var(--green); background: #f3fff0; box-shadow: 0 4px 0 var(--green-dark); }
    .mode-card .ic { font-size: 40px; }
    .mode-card .t { font-weight: 800; margin-top: 6px; }
    .mode-card .d { font-size: 12px; color: var(--text-mute); margin-top: 4px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script src="/js/state.js?v=11"></script>
  <script src="/js/catalog.js?v=10"></script>
  <script src="/js/layout.js?v=12"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-init.js?v=1"></script>
  <script src="/js/auth.js?v=1"></script>
  <script src="/js/csv.js?v=10"></script>
  <script src="/js/quiz-core.js?v=10"></script>
  <script src="/js/vocab-notes.js?v=5"></script>
  <script>
  (function () {
    const root = document.getElementById('app');
    let state = State.load();
    const { sidebar } = renderShell({ active: 'quick', state });

    // Default question targets per mode (tuned for ~15 minutes)
    const TARGET = { reading: 20, listening: 12, mixed: 15 };
    let mode = localStorage.getItem('toeicets_quick_mode') || 'reading';

    function renderChooser() {
      const card = (m, ic, t, d) => `
        <div class="mode-card ${mode === m ? 'active' : ''}" data-mode="${m}">
          <div class="ic">${ic}</div><div class="t">${t}</div><div class="d">${d}</div>
        </div>`;
      root.innerHTML = sidebar + `
        <main class="main">
          <h2 style="font-size:26px;font-weight:900;">⚡ Kiểm tra nhanh 15 phút</h2>
          <p style="color:var(--text-mute);margin:6px 0 18px;line-height:1.6;">
            Câu hỏi lấy ngẫu nhiên từ toàn bộ 60 đề. Đồng hồ đếm ngược 15 phút — hết giờ tự nộp bài. Chọn loại câu rồi bắt đầu.
          </p>
          <div class="card" style="padding:18px;">
            <h3 class="section-title" style="margin-top:0;">Chọn loại câu</h3>
            <div class="mode-grid">
              ${card('reading', '📖', 'Chỉ Reading', 'Part 5/6/7 — không audio, làm nhanh (~20 câu)')}
              ${card('listening', '🎧', 'Chỉ Listening', 'Part 1/2/3/4 — có audio (~12 câu)')}
              ${card('mixed', '🎲', 'Trộn cả hai', 'Nghe + đọc, sát đề thật (~15 câu)')}
            </div>
            <button class="btn gold" id="start" style="margin-top:18px;">▶ Bắt đầu (15 phút)</button>
          </div>
        </main>`;
      root.querySelectorAll('.mode-card').forEach(c => {
        c.addEventListener('click', () => {
          mode = c.dataset.mode;
          localStorage.setItem('toeicets_quick_mode', mode);
          root.querySelectorAll('.mode-card').forEach(x => x.classList.toggle('active', x.dataset.mode === mode));
        });
      });
      document.getElementById('start').addEventListener('click', start);
    }

    async function start() {
      // Unlock audio within this click gesture so Listening clips can autoplay after sampling
      try { const _s = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA='); _s.volume = 0; const _p = _s.play(); if (_p && _p.catch) _p.catch(()=>{}); } catch(e) {}
      root.innerHTML = sidebar + `<main class="main"><div class="center" style="padding:60px 0;text-align:center;">
        <div style="font-size:60px;">⚡</div><h2>Đang bốc câu hỏi…</h2>
        <p style="color:var(--text-mute);">Lấy ngẫu nhiên từ 60 đề</p></div></main>`;
      let cards = [];
      try {
        cards = await QuizCore.sample(mode, TARGET[mode] || 15);
      } catch (e) { /* ignore, handled below */ }
      if (!cards || !cards.length) {
        root.innerHTML = sidebar + `<main class="main"><div class="center" style="padding:60px 0;text-align:center;">
          <div style="font-size:60px;">😢</div><h2>Không bốc được câu hỏi</h2>
          <p style="color:var(--text-mute);">Kiểm tra kết nối rồi thử lại.</p>
          <a class="btn ghost" href="/quick">Quay lại</a></div></main>`;
        return;
      }
      QuizCore.startQuiz({
        root, sidebar, cards, minutes: 15,
        onFinish: (s) => {
          // Feature 1 (later): Auth.addHistory({ type:'quick', mode, ...s })
          if (window.Auth && window.Auth.addHistory) {
            window.Auth.addHistory({ type: 'quick', mode, total: s.total, correct: s.correct, wrong: s.wrong, blank: s.blank });
          }
        }
      });
    }

    renderChooser();
  })();
  </script>
  <script>
    if (window.VocabNotes) VocabNotes.enableCapture();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(e => console.warn('SW reg failed:', e));
      });
    }
  </script>
</body>
</html>
