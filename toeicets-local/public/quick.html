<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet"/>
  <meta name="theme-color" content="#58CC02"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="TOEIC Quest"/>
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <title>TOEIC Quest — Kiểm tra nhanh</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=10"/>
  <link rel="alternate icon" href="/favicon.ico"/>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=10"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=11"/>
  <style>
    .sub-q { padding: 16px 0; border-top: 1px dashed var(--border); }
    .sub-q:first-of-type { border-top: none; padding-top: 0; }
    .sub-q .q-num { font-size: 12px; font-weight: 800; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .sub-q .q-text { font-size: 17px; font-weight: 700; margin-bottom: 10px; line-height: 1.4; }
    /* Blind mode: Part 1, 2 — hide question + option text while listening; show only A/B/C/D */
    .sub-q.blind .q-text { display: none; }
    .sub-q.blind .options { display: flex; flex-direction: row; justify-content: center; flex-wrap: wrap; gap: 20px; padding: 24px 0; margin-bottom: 0; }
    .sub-q.blind .option { width: 80px; height: 80px; padding: 0; border-radius: 50%; justify-content: center; gap: 0; }
    .sub-q.blind .option > span:not(.letter) { display: none; }
    .sub-q.blind .option .letter { width: 100%; height: 100%; background: transparent; border: none; font-size: 32px; font-weight: 900; }
    .sub-q.blind .option.selected { background: var(--blue); border-color: var(--blue-dark); }
    .sub-q.blind .option.selected .letter { color: white; }
    .group-toolbar { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg-alt) 80%, transparent); padding: 16px 0; display: flex; gap: 12px; align-items: center; z-index: 5; }
    .pick-count { font-weight: 800; color: var(--text-soft); font-size: 13px; }
    .btn[disabled] { opacity: 0.5; cursor: not-allowed; box-shadow: 0 4px 0 var(--border); background: var(--text-mute); }
    .reveal-block { margin-top: 14px; padding: 14px; border-radius: 10px; background: var(--bg-alt); border-left: 4px solid var(--blue); }
    .reveal-block .heading { font-weight: 800; font-size: 13px; color: var(--text-mute); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
    .reveal-block .body { font-size: 14px; line-height: 1.6; white-space: pre-line; max-height: 280px; overflow-y: auto; }
    /* timer + sticky header so the clock stays visible across all questions */
    .player-header { position: sticky; top: 0; z-index: 10; background: var(--bg-alt); padding: 10px 0; margin-bottom: 12px; border-bottom: 2px solid var(--border); }
    .test-timer { font-weight: 900; font-size: 15px; padding: 6px 12px; border-radius: 12px; background: white; border: 2px solid var(--border); color: var(--text); white-space: nowrap; }
    .test-timer.warning { background: #ffe0e0; color: #e02020; animation: timer-pulse 1s ease-in-out infinite; }
    @keyframes timer-pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
    /* result grid */
    .q-result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; margin-top: 8px; }
    .q-result { padding: 10px 0; border-radius: 10px; font-weight: 800; font-size: 15px; border: 2px solid var(--border); cursor: pointer; color: white; }
    .q-result.correct { background: var(--green); border-color: var(--green-dark); }
    .q-result.wrong { background: var(--red); border-color: #c0392b; }
    .q-result.blank { background: var(--text-mute); border-color: var(--border); }
    .q-result:hover { filter: brightness(1.08); }
    .q-card .option[disabled] { cursor: default; opacity: 1; }
    /* mode chooser */
    .mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 8px; }
    .mode-card { border: 3px solid var(--border); border-radius: 16px; padding: 18px; cursor: pointer; text-align: center; background: white; transition: all .12s; }
    .mode-card:hover { border-color: var(--blue); }
    .mode-card.active { border-color: var(--green); background: #f3fff0; box-shadow: 0 4px 0 var(--green-dark); }
    .mode-card .ic { font-size: 40px; }
    .mode-card .t { font-weight: 800; margin-top: 6px; }
    .mode-card .d { font-size: 12px; color: var(--text-mute); margin-top: 4px; line-height: 1.4; }
    /* time chooser */
    .tm-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .tm-chip { border: 2px solid var(--border); background: white; border-radius: 12px; padding: 10px 18px; font-weight: 800; cursor: pointer; font-size: 15px; font-family: inherit; color: var(--text-soft); }
    .tm-chip.active { border-color: var(--green); background: #f3fff0; color: var(--green-dark); }
    .tm-chip .q { display: block; font-weight: 700; font-size: 11.5px; color: var(--text-mute); margin-top: 2px; }
    .tm-chip.active .q { color: var(--green-dark); }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script src="/js/state.js?v=11"></script>
  <script src="/js/history.js?v=1"></script>
  <script src="/js/catalog.js?v=10"></script>
  <script src="/js/layout.js?v=13"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="/js/firebase-init.js?v=1"></script>
  <script src="/js/auth.js?v=1"></script>
  <script src="/js/csv.js?v=10"></script>
  <script src="/js/quiz-core.js?v=20"></script>
  <script src="/js/sessions.js?v=3"></script>
  <script src="/js/vocab-notes.js?v=5"></script>
  <script>
  (function () {
    const root = document.getElementById('app');
    let state = State.load();
    const { sidebar } = renderShell({ active: 'quick', state });

    // Pick how long you have; the number of questions follows from it. The pace is given as
    // minutes per 100 questions, and sits a little below the real exam on purpose — the
    // exam allows 45 minutes for 100 listening questions and 75 for 100 reading, which
    // leaves no room to replay a clip or re-read a passage. Reading is the loosest of the
    // three because it was the one that could not be finished in time.
    const MINUTES = [10, 20, 30];
    const PER_100 = { listening: 50, reading: 80, mixed: 130 };   // mixed = a whole paper
    const PACE = { listening: 100 / PER_100.listening, reading: 100 / PER_100.reading,
                   mixed: 200 / PER_100.mixed };
    const TAG = { reading: '📖 Reading', listening: '🎧 Listening', mixed: '🎲 Trộn' };
    const targetFor = (m, mins) => Math.max(5, Math.round(mins * (PACE[m] || PACE.mixed)));
    let mode = localStorage.getItem('toeicets_quick_mode') || 'reading';
    let minutes = parseInt(localStorage.getItem('toeicets_quick_minutes') || '20', 10);
    if (MINUTES.indexOf(minutes) === -1) minutes = 20;

    function renderChooser() {
      const card = (m, ic, t, d) => `
        <div class="mode-card ${mode === m ? 'active' : ''}" data-mode="${m}">
          <div class="ic">${ic}</div><div class="t">${t}</div>
          <div class="d">${d} <span class="mc-n">(~${targetFor(m, minutes)} câu)</span></div>
        </div>`;
      root.innerHTML = sidebar + `
        <main class="main">
          <h2 style="font-size:26px;font-weight:900;">⚡ Kiểm tra nhanh</h2>
          <p style="color:var(--text-mute);margin:6px 0 18px;line-height:1.6;">
            Câu hỏi lấy ngẫu nhiên từ toàn bộ 60 đề. Chọn <b>bạn có bao nhiêu phút</b> — số câu tự tính theo
            nhịp thoải mái hơn đề thật một chút (nghe 100 câu/50 phút, đọc 100 câu/80 phút). Hết giờ tự nộp bài.
          </p>
          <div class="card" style="padding:18px;">
            <h3 class="section-title" style="margin-top:0;">1️⃣ Chọn loại câu</h3>
            <div class="mode-grid">
              ${card('reading', '📖', 'Chỉ Reading', 'Part 5/6/7 — không audio')}
              ${card('listening', '🎧', 'Chỉ Listening', 'Part 1/2/3/4 — có audio')}
              ${card('mixed', '🎲', 'Trộn cả hai', 'Nghe + đọc, sát đề thật')}
            </div>
            <h3 class="section-title">2️⃣ Bạn có bao nhiêu thời gian?</h3>
            <div class="tm-row">
              ${MINUTES.map(t => `<button class="tm-chip ${t === minutes ? 'active' : ''}" data-t="${t}">${t} phút<span class="q">~${targetFor(mode, t)} câu</span></button>`).join('')}
            </div>
            <button class="btn gold" id="start" style="margin-top:18px;">▶ Bắt đầu (${minutes} phút · ~${targetFor(mode, minutes)} câu)</button>
          </div>
          ${Sessions.panel('quick', { empty: 'Chưa có lượt nào. Làm xong một lượt là nó tự lưu ở đây — xem lại từng câu đúng/sai, hoặc làm lại đúng bộ câu đó để so với lần trước.' })}
        </main>`;
      root.querySelectorAll('.mode-card').forEach(c => {
        c.addEventListener('click', () => {
          mode = c.dataset.mode;
          localStorage.setItem('toeicets_quick_mode', mode);
          repaintChoices();
        });
      });
      root.querySelectorAll('.tm-chip').forEach(c => {
        c.addEventListener('click', () => {
          minutes = parseInt(c.dataset.t, 10);
          localStorage.setItem('toeicets_quick_minutes', minutes);
          repaintChoices();
        });
      });
      document.getElementById('start').addEventListener('click', start);
      Sessions.bind(root, 'quick', { open: openSession, refresh: renderChooser });
    }

    // Both choices feed the same number, so either one changes every label that shows it.
    function repaintChoices() {
      root.querySelectorAll('.mode-card').forEach(x => {
        x.classList.toggle('active', x.dataset.mode === mode);
        const n = x.querySelector('.mc-n');
        if (n) n.textContent = `(~${targetFor(x.dataset.mode, minutes)} câu)`;
      });
      root.querySelectorAll('.tm-chip').forEach(x => {
        const t = parseInt(x.dataset.t, 10);
        x.classList.toggle('active', t === minutes);
        const q = x.querySelector('.q');
        if (q) q.textContent = `~${targetFor(mode, t)} câu`;
      });
      const btn = document.getElementById('start');
      if (btn) btn.textContent = `▶ Bắt đầu (${minutes} phút · ~${targetFor(mode, minutes)} câu)`;
    }

    // Unlock audio within the click gesture so Listening clips can autoplay after sampling.
    function unlockAudio() {
      try {
        const a = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
        a.volume = 0;
        const p = a.play();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }
    function loading(msg, sub) {
      root.innerHTML = sidebar + `<main class="main"><div class="center" style="padding:60px 0;text-align:center;">
        <div style="font-size:60px;">⚡</div><h2>${msg}</h2>
        <p style="color:var(--text-mute);">${sub || ''}</p></div></main>`;
    }
    function failed(msg, sub) {
      root.innerHTML = sidebar + `<main class="main"><div class="center" style="padding:60px 0;text-align:center;">
        <div style="font-size:60px;">😢</div><h2>${msg}</h2>
        <p style="color:var(--text-mute);">${sub || ''}</p>
        <a class="btn ghost" href="/quick">Quay lại</a></div></main>`;
    }

    // One launcher for a fresh sitting, a saved one reopened, and a redo of that same set.
    // A redo keeps the clock the original sitting was taken under, not whatever is selected
    // now, so the two attempts stay comparable.
    function play(cards, runMode, runMinutes, replay) {
      let lastResults = null;
      QuizCore.startQuiz({
        root, sidebar, cards, minutes: runMinutes, feature: 'quick',
        replay: replay || null,
        title: replay ? `Bài đã làm • ${TAG[runMode] || runMode} · ${runMinutes} phút` : undefined,
        onResults: (rs) => { lastResults = rs; },
        onFinish: (s) => {
          if (window.Auth && window.Auth.addHistory) {
            window.Auth.addHistory({ type: 'quick', mode: runMode, minutes: runMinutes, total: s.total, correct: s.correct, wrong: s.wrong, blank: s.blank });
          }
          try {
            Sessions.add({ feature: 'quick', mode: runMode, minutes: runMinutes,
                           tag: `${TAG[runMode] || runMode} · ${runMinutes}p`,
                           results: lastResults, secs: s.secs });
          } catch (e) {}
        }
      });
    }

    async function start() {
      unlockAudio();
      const want = targetFor(mode, minutes);
      loading('Đang bốc câu hỏi…', `${want} câu · ${minutes} phút · lấy ngẫu nhiên từ 60 đề`);
      let cards = [];
      try {
        cards = await QuizCore.sample(mode, want);
      } catch (e) { /* ignore, handled below */ }
      if (!cards || !cards.length) { failed('Không bốc được câu hỏi', 'Kiểm tra kết nối rồi thử lại.'); return; }
      play(cards, mode, minutes);
    }

    // Reopen a saved sitting: view it with the answers filled in, or redo the same questions.
    async function openSession(id, redo) {
      const s = Sessions.get(id);
      if (!s) { failed('Không tìm thấy bài đã làm'); return; }
      unlockAudio();
      loading(redo ? `Đang mở lại ${s.total} câu…` : 'Đang mở bài đã làm…',
              `${Sessions.when(s.at)} • ${s.total} câu`);
      let built = { cards: [], replay: [] };
      try { built = await QuizCore.cardsFromSession(s); } catch (e) {}
      if (!built.cards.length) { failed('Không mở lại được bài này'); return; }
      // Runs saved before the clock became selectable were all 20-minute sittings.
      play(built.cards, s.mode || 'mixed', s.minutes || 20, redo ? null : built.replay);
    }

    renderChooser();
  })();
  </script>
  <script>
    if (window.VocabNotes) VocabNotes.enableCapture();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(e => console.warn('SW reg failed:', e));
      });
    }
  </script>
</body>
</html>
